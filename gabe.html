<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Hello, Gabe Perez</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: radial-gradient(circle at 50% 40%, #1e3a8a 0%, #0b1330 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.25rem;
    padding: 0 1.5rem;
  }
  h1 {
    color: #ffffff;
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 600;
    text-align: center;
    margin: 0;
    letter-spacing: -0.02em;
  }
  #demo-btn {
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 600;
    color: #0b1330;
    background: #ffffff;
    border: none;
    border-radius: 999px;
    padding: 0.9rem 2.2rem;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  #demo-btn:hover { transform: translateY(-1px); }
  #demo-btn.live {
    background: #dc2626;
    color: #ffffff;
  }
  #demo-status {
    color: #bcd0ff;
    font-size: 0.95rem;
    min-height: 1.2em;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Hello, Gabe Perez</h1>
    <button id="demo-btn">Start Demo Call</button>
    <div id="demo-status"></div>
  </div>

  <script>
    const ELEVENLABS_AGENT_ID = 'agent_2801kz4d0bqxfthvztzh8bn9jd38';
    const ELEVENLABS_SDK_URL = 'https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.15.0/+esm';

    const btn = document.getElementById('demo-btn');
    const status = document.getElementById('demo-status');
    let conversation = null;

    const setIdle = () => {
      conversation = null;
      btn.textContent = 'Start Demo Call';
      btn.classList.remove('live');
      btn.disabled = false;
    };

    const startCall = async () => {
      btn.disabled = true;
      status.textContent = 'Connecting…';
      try {
        const { Conversation } = await import(/* webpackIgnore: true */ ELEVENLABS_SDK_URL);
        await navigator.mediaDevices.getUserMedia({ audio: true });
        conversation = await Conversation.startSession({
          agentId: ELEVENLABS_AGENT_ID,
          connectionType: 'webrtc',
          onConnect: () => {
            status.textContent = 'Live — call connected';
            btn.textContent = 'End Call';
            btn.classList.add('live');
            btn.disabled = false;
          },
          onDisconnect: () => {
            status.textContent = 'Call ended';
            setIdle();
          },
          onError: (err) => {
            console.error('ElevenLabs conversation error', err);
            status.textContent = 'Call failed';
            setIdle();
          },
        });
      } catch (err) {
        console.error('Could not start ElevenLabs conversation', err);
        status.textContent = 'Mic access needed';
        setIdle();
      }
    };

    const endCall = async () => {
      btn.disabled = true;
      const active = conversation;
      conversation = null;
      if (active) await active.endSession().catch(() => {});
      status.textContent = 'Call ended';
      setIdle();
    };

    btn.addEventListener('click', () => {
      if (conversation) endCall();
      else startCall();
    });
  </script>
</body>
</html>
